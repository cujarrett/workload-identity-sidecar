name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sidecar/secret-fetcher
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: sidecar/secret-fetcher/go.mod

      - run: go mod tidy -diff

      - run: go vet ./...

      - run: go test -race ./...
