name: CD

on:
  push:
    branches: [main]

jobs:
  # Gates the image build. A sidecar that fails its tests never reaches ghcr.
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sidecar
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: sidecar/go.mod

      - run: go vet ./...

      - run: go test -race ./...

  build-and-push-sidecar:
    needs: test
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: cujarrett/homelab/.github/workflows/build-image.yml@main
    with:
      image: ghcr.io/cujarrett/workload-identity-sidecar
      tags: |
        ghcr.io/cujarrett/workload-identity-sidecar:main
        ghcr.io/cujarrett/workload-identity-sidecar:sha-${{ github.sha }}
      context: sidecar
      cache-scope: workload-identity-sidecar
