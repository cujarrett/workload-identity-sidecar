name: CD

on:
  push:
    branches: [main]

jobs:
  # Gates the image build - a sidecar that cannot read a secret should never reach ghcr.
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sidecar/secret-fetcher
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: sidecar/secret-fetcher/go.mod

      - run: go vet ./...

      - run: go test -race ./...

  build-and-push-sidecar:
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: sidecar
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/cujarrett/workload-identity-sidecar:main
            ghcr.io/cujarrett/workload-identity-sidecar:sha-${{ github.sha }}
